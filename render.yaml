services:
  - type: web
    name: shabytbio
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Everything below is a secret — Render will prompt you to paste each
      # one in during setup instead of storing it in this file / your repo.
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      # Auto-generated by Render, you never need to see or copy this one.
      - key: SESSION_SECRET
        generateValue: true
